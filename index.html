<style>
  body.noscroll { overflow: hidden; }
  .loading { padding: 60px 0; text-align: center; color: var(--muted); }
  .resume { border: 1px solid var(--ink); padding: 16px 18px; margin: 18px 0 0; }
  .resume .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .scoring { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .scoring b { color: var(--ink); }
  .bonusrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--ink); padding: 14px; margin-bottom: 12px; }

  .bonusrow .sel img { width: 100%; height: 100%; object-fit: contain; }
  .bonusrow .sel b { display: block; font-size: 13px; text-transform: uppercase; }
  .bonusrow .sel span { display: block; font-size: 13px; color: var(--muted); }
  .bonusrow .side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .bonusrow h3 { margin: 0; font-size: 16px; text-transform: uppercase; }
  .bonusrow p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .kbd { display: inline-block; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; font: 600 11px/18px var(--font); color: var(--muted); }
  @media (max-width: 720px) { .hint .kbdhint { display: none; } }

<body>
<header class="topbar">
  <div class="wrap in">
    <a class="wordmark" href="#s=landing" aria-label="GPHG 2026 Ballot home"><b>GPHG</b><span>2026</span><small>Ballot</small></a>
    <nav class="topnav">
      <button type="button" id="nav-mine" class="hidden">My ballot</button>
      <a href="board.html">Standings</a>
    </nav>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
</header>

<main id="app" class="wrap"><div class="loading">Loading the 84 nominees…</div></main>

<footer><div class="wrap">Nominee details and photographs are from <a href="https://www.gphg.org/en/gphg-2026/nominated-timepieces" target="_blank" rel="noopener">gphg.org</a>, © Fondation du Grand Prix d'Horlogerie de Genève. This is a friends' prediction pool and is not affiliated with the GPHG.</div></footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/core.js?v=20261106b"></script>
<script>
(function () {
  'use strict';
  const G = window.GPHG, esc = G.esc;
  let D = null;
  const STEPS = Array.from({ length: 14 }, (_, i) => 'cat-' + i).concat(['aiguille', 'audacity', 'revelation', 'chronometry', 'review']);
  const S = { name: '', picks: G.emptyPicks(), step: null, submitted: null, viewing: null, lastStep: null };
  const ARCHIVE = 'gphg26.archive';   // other people's locked ballots on this device
  function archive() { return (G.lsGet(ARCHIVE, []) || []).filter(x => x && x.code && G.decodeBallot(x.code)); }
  const app = document.getElementById('app');
  let sheetDepth = 0;

  /* ---------- boot & routing ---------- */
  async function boot() {
    try { D = await G.loadData(); } catch (e) { app.innerHTML = '<div class="notice red">Could not load the nominee data. ' + esc(e.message) + '</div>'; return; }
    const sub = G.lsGet(G.KEYS.ballot);
    if (sub && sub.code) { const b = G.decodeBallot(sub.code); if (b) S.submitted = b; }
    const draft = G.lsGet(G.KEYS.draft);
    if (draft) { S.name = draft.name || ''; S.picks = Object.assign(G.emptyPicks(), draft.picks || {}); S.lastStep = draft.step || null; S.draftTs = draft.draftTs || null; }
    else if (S.submitted) { S.name = S.submitted.name; S.picks = JSON.parse(JSON.stringify(S.submitted.picks)); }   // so Back from the card never shows a blank review
    if (!S.name) S.name = G.lsGet(G.KEYS.name, '') || '';
    if (history.state && history.state.sheet) history.replaceState(null, '');   // a sheet was open when the page was last unloaded
    document.getElementById('nav-mine').addEventListener('click', () => go('card'));
    if (S.submitted) syncPool();
    if (draft && !S.submitted) setTimeout(syncDraft, 800);
    window.addEventListener('hashchange', route);
    window.addEventListener('popstate', () => {
      if (sheetDepth > 0) { closeSheet(true); return; }
      if (pendingBack) { pendingBack = false; const s = pendingNav; pendingNav = null; if (s) go(s); }
    });
    document.addEventListener('keydown', onKey);
    route();
  }

  function route() {
    const h = location.hash || '';
    const b = (location.search || '').match(/[?&]b=([A-Za-z0-9_-]+)/) || h.match(/^#b=([A-Za-z0-9_-]+)/);
    if (b && !/^#s=/.test(h)) {
      const ballot = G.decodeBallot(b[1]);
      if (!ballot) return render('badlink');
      if (S.submitted && ballot.code === S.submitted.code) return render('card');   // opening your own link
      S.viewing = ballot; return render('view');
    }
    if (location.search) history.replaceState(null, '', location.pathname + h);   // leave a friend's ?b= behind once you move on
    const s = h.match(/^#s=([a-z0-9-]+)/);
    if (s && s[1] === 'bonus') return render('review');
    if (s && (STEPS.includes(s[1]) || s[1] === 'landing' || s[1] === 'card')) return render(s[1]);
    if (S.submitted) return render('card');
    render('landing');
  }
  let pendingBack = false, pendingNav = null;
  function go(step) {
    if (pendingBack) { pendingNav = step; return; }   // a sheet just closed via history.back(); navigate once that lands
    if (location.hash === '#s=' + step) render(step); else location.hash = '#s=' + step;
  }
  function saveDraft() {
    if (!S.draftTs) S.draftTs = Date.now();
    G.lsSet(G.KEYS.draft, { name: S.name, picks: S.picks, step: S.step, draftTs: S.draftTs });
    if (S.name) G.lsSet(G.KEYS.name, S.name);
    scheduleDraftSync();
  }
  // Progressive submission: an in-progress ballot shows on the standings as soon as it has a name and a pick.
  let draftTimer = null, lastDraftCode = null;
  function draftCode() { if (!S.name || G.filled(S.picks) === 0 || G.isLocked()) return null; return G.encodeBallot({ name: S.name, picks: S.picks, ts: S.draftTs || Date.now() }); }
  function scheduleDraftSync() { clearTimeout(draftTimer); draftTimer = setTimeout(syncDraft, 1500); }
  async function syncDraft() {
    clearTimeout(draftTimer);
    const code = draftCode(); if (!code || code === lastDraftCode) return;
    if (S.submitted && JSON.stringify(S.submitted.picks) === JSON.stringify(S.picks)) return;   // nothing new beyond the locked ballot
    try { await G.poolDraft({ code, name: S.name, ts: S.draftTs || Date.now() }); lastDraftCode = code; } catch (e) { /* retried on the next change or visit */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') syncDraft(); });
  window.addEventListener('pagehide', syncDraft);

  function render(step) {
    if (sheetDepth > 0) closeSheet(false);
    S.step = step;
    document.getElementById('nav-mine').classList.toggle('hidden', !S.submitted || step === 'card');
    const idx = STEPS.indexOf(step);
    document.getElementById('prog').style.width = idx < 0 ? (step === 'card' || step === 'view' ? '100%' : '0') : Math.round((idx + 1) / STEPS.length * 100) + '%';
    window.scrollTo(0, 0);
    if (step === 'landing') renderLanding();
    else if (step.startsWith('cat-')) renderCat(+step.slice(4));
    else if (['aiguille', 'audacity', 'revelation', 'chronometry'].includes(step)) renderSpecial(step);
    else if (step === 'review') renderReview();
    else if (step === 'card') renderCard(S.submitted, 'own');
    else if (step === 'view') renderCard(S.viewing, 'view');
    else if (step === 'badlink') { app.innerHTML = '<div class="notice red" style="margin-top:24px">That ballot link is damaged or incomplete. Ask for it to be sent again.</div><p><a href="./">Make your own ballot</a></p>'; }
    if (STEPS.includes(step)) saveDraft();
  }

  function picksMade() { return S.picks.cats.filter(x => x != null).length + (S.picks.aiguille != null ? 1 : 0); }

  /* ---------- the pool: every locked ballot is posted to the shared pool; retried on every visit until it lands ---------- */
  let poolState = 'idle', poolInfo = null;
  function pooledNow() { const p = G.lsGet(G.KEYS.pooled); return p && S.submitted && p.code === S.submitted.code ? p : null; }
  async function syncPool(force) {
    if (!S.submitted) return;
    const p = pooledNow();
    if (p && !force) { poolState = 'pooled'; poolInfo = p; paintPool(); return; }
    poolState = 'pending'; paintPool();
    try {
      const r = await G.poolSubmit(S.submitted);
      poolInfo = { code: S.submitted.code, received: r.received || Date.now() };
      G.lsSet(G.KEYS.pooled, poolInfo); poolState = 'pooled';
    } catch (e) { poolState = 'failed'; poolInfo = { error: e && e.message }; }
    paintPool();
  }
  function poolHTML() {
    if (poolState === 'pooled') return `<div class="eyebrow" style="color:var(--good)">✓ In the pool${poolInfo && poolInfo.received ? ' · ' + esc(G.fmtDate(poolInfo.received)) : ''}</div>`;
    if (poolState === 'failed') return `<div class="eyebrow">Not in the pool yet</div><p class="small" style="margin:6px 0 0">We couldn’t reach the pool just now. <button type="button" class="linkbtn" id="retrypool">Try again</button>, or send Spencer your link below and he’ll add it.</p>`;
    return `<div class="eyebrow gray">Adding to the pool…</div>`;
  }
  function paintPool() {
    const el = document.getElementById('poolstatus'); if (!el) return;
    el.innerHTML = poolHTML();
    const rb = el.querySelector('#retrypool'); if (rb) rb.addEventListener('click', () => syncPool(true));
    const r = document.getElementById('resumepool'); if (r) r.innerHTML = poolState === 'pooled' ? 'Your picks are locked and in the pool.' : poolState === 'failed' ? 'Your picks are locked on this device but not in the pool yet.' : 'Your picks are locked.';
  }
  function lockedNotice() { return G.isLocked() ? '<div class="notice red">The ceremony has started: ballots are locked. You can still browse the nominees and see the <a href="board.html">standings</a>.</div>' : ''; }

  /* ---------- landing ---------- */
  function renderLanding() {
    const strip = D.watches.filter((w, i) => i % 4 === 1).map(w => `<div class="pic"><img src="${G.thumb(w.id)}" alt="${esc(w.brand + ' ' + w.name)}" loading="lazy"></div>`).join('');
    const made = picksMade();
    let resume = '';
    if (S.submitted) {
      resume = `<div class="resume"><div class="eyebrow">${esc(S.submitted.name)}, you’re in</div><p style="margin:6px 0 0"><span id="resumepool">Your picks are locked.</span>${G.isLocked() ? '' : ' You can still change them until the ceremony starts.'}</p><div class="btns"><button class="btn sm red" data-go="card">My ballot</button><a class="btn sm ghost" href="board.html">Everyone’s picks</a>${G.isLocked() ? '' : '<button class="btn sm ghost" data-act="edit">Edit picks</button>'}</div></div>`;
    } else if (made > 0 && S.name) {
      resume = `<div class="resume"><div class="eyebrow">Welcome back</div><p style="margin:6px 0 0">${esc(S.name)}, you've made ${made} of 15 required picks.</p><div class="btns"><button class="btn sm" data-act="resume">Resume</button><button class="btn sm ghost" data-act="reset">Start over</button></div></div>`;
    }
    app.innerHTML = `
      <section class="hero" style="margin:0 -20px"><div class="wrap">
        <div class="eyebrow">Grand Prix d’Horlogerie de Genève · 2026 Edition</div>
        <h1>Call the<br>winners.</h1>
        <p>84 nominees. 14 categories. One Aiguille d’Or. The jury announces its verdicts in Geneva on Saturday 7 November. Lock in your picks before they do, then find out who really knows watches.</p>
        <div class="meta"><span>Ballots lock ${esc(G.fmtLock())}</span><span>Max ${G.maxPoints()} points</span><span>About five minutes</span></div>
      </div></section>
      <div class="strip" aria-hidden="true">${strip}</div>
      ${lockedNotice()}
      <section class="start">
        <div>
          <h2 class="title big"><b>Enter the pool</b><span>One ballot per person</span></h2>
          ${resume}
          <form id="startform" class="${S.submitted ? 'hidden' : ''}">
            <div class="field"><label for="name">Your name</label><input class="input" id="name" type="text" maxlength="40" autocomplete="name" placeholder="So the scorecard is yours" value="${esc(S.name)}" required></div>
            <button class="btn big red" type="submit" ${G.isLocked() ? 'disabled' : ''}>Start the ballot →</button>
          </form>
          ${S.submitted ? '<p class="small muted" style="margin-top:14px">Someone else want to play on this device? <button class="linkbtn" data-act="reset">Start a new ballot</button>. ' + esc(S.submitted.name) + '’s stays in the pool.</p>' : ''}
          ${archive().length ? `<div class="resume" style="margin-top:12px"><div class="eyebrow gray">Also on this device</div>${archive().map(x => `<div class="small" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0"><span><b>${esc(x.name)}</b> · locked ${esc(G.fmtDate(x.ts))}</span><button class="btn sm ghost" data-act="switch:${esc(x.code)}">Switch to ${esc(x.name)}</button></div>`).join('')}</div>` : ''}
        </div>
        <div>
          <div class="sechead" style="margin-top:0">How it works</div>
          <div class="steps">
            <div><span class="n">1</span><div><b>Pick a winner in all 14 categories</b><span>Six nominees each. Tap a watch to pick it, tap ⓘ to see photos, specs, price and the brand’s pitch.</span></div></div>
            <div><span class="n">2</span><div><b>Call the special prizes</b><span>The Aiguille d’Or (best in show, 3 points), then three optional bonus prizes worth a point each.</span></div></div>
            <div><span class="n">3</span><div><b>Submit and you’re in</b><span>Your picks show on the standings as you go, marked in progress until you submit. Compare with everyone, then see who called it after the ceremony.</span></div></div>
          </div>
          <div class="sechead">Scoring</div>
          <p class="scoring"><b>1 point</b> per category winner (14). <b>3 points</b> for the Aiguille d’Or. <b>1 bonus point</b> each for Audacity, Horological Revelation and Chronometry, if the jury awards them. Ties go to whoever called more prizes, then to the earlier ballot.</p>
        </div>
      </section>`;
    app.querySelector('#startform').addEventListener('submit', e => {
      e.preventDefault();
      const n = app.querySelector('#name').value.trim();
      if (!n) { app.querySelector('#name').focus(); return; }
      S.name = n; saveDraft();
      go(firstIncomplete());
    });
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
    app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
  }
  function stashCurrent() {
    if (!S.submitted) return;
    const list = archive().filter(x => x.code !== S.submitted.code);
    list.unshift({ name: S.submitted.name, code: S.submitted.code, ts: S.submitted.ts });
    G.lsSet(ARCHIVE, list.slice(0, 8));
  }
  function firstIncomplete() { const i = S.picks.cats.findIndex(x => x == null); if (i >= 0) return 'cat-' + i; if (S.picks.aiguille == null) return 'aiguille'; return 'review'; }
  function nextStep(step) { const i = STEPS.indexOf(step); return STEPS[Math.min(i + 1, STEPS.length - 1)]; }
  function prevStep(step) { const i = STEPS.indexOf(step); return i <= 0 ? 'landing' : STEPS[i - 1]; }
  function act(a) {
    if (a === 'resume') go(firstIncomplete());
    else if (a === 'reset') {
      const who = S.submitted ? S.submitted.name : S.name;
      if (!confirm(S.submitted ? `Start a new ballot for someone else? ${who}’s ballot stays in the pool, and you can switch back to it from this page.` : 'Start over with a blank ballot?')) return;
      stashCurrent();
      S.name = ''; S.picks = G.emptyPicks(); S.submitted = null; S.draftTs = null; lastDraftCode = null; G.lsDel(G.KEYS.draft); G.lsDel(G.KEYS.ballot); G.lsDel(G.KEYS.name); go('landing');
    }
    else if (a.startsWith('switch:')) {
      const code = a.slice(7); const target = archive().find(x => x.code === code); if (!target) return;
      stashCurrent();
      G.lsSet(ARCHIVE, archive().filter(x => x.code !== code));
      const b = G.decodeBallot(code); S.submitted = b; S.name = b.name; S.picks = JSON.parse(JSON.stringify(b.picks));
      G.lsSet(G.KEYS.ballot, { name: b.name, ts: b.ts, code }); G.lsDel(G.KEYS.draft); G.lsSet(G.KEYS.name, b.name);
      syncPool(); go('card');
    }
    else if (a === 'edit') {
      if (!S.submitted) return;
      // Resume an edit already in progress; otherwise start editing from the locked picks.
      if (!G.lsGet(G.KEYS.draft)) { S.name = S.submitted.name; S.picks = JSON.parse(JSON.stringify(S.submitted.picks)); saveDraft(); }
      go('review');
    }
  }

  /* ---------- category round ---------- */
  function renderCat(i) {
    const c = D.categories[i];
    const ws = G.watchesInCat(i);
    app.innerHTML = `
      ${lockedNotice()}
      <div class="roundhead">
        <div><div class="eyebrow">Category ${i + 1} of 14</div><h1 class="title big"><b>${esc(c.name)}</b><span>Who wins?</span></h1></div>
        <div class="ptsbadge">${c.pts} pt</div>
        <p class="blurb">${esc(c.blurb)}</p>
      </div>
      <div class="grid" id="grid">${ws.map((w, k) => card(w, k)).join('')}</div>
      <div class="actions">
        <button class="btn ghost" id="back">← Back</button>
        <span class="hint">Tap a watch to pick it · ⓘ for details<span class="kbdhint"> · keys <span class="kbd">1</span>–<span class="kbd">6</span></span></span>
        <button class="btn" id="next" ${S.picks.cats[i] == null ? 'disabled' : ''}>Next →</button>
      </div>`;
    const grid = app.querySelector('#grid');
    grid.addEventListener('click', e => {
      const cardEl = e.target.closest('.card'); if (!cardEl) return;
      const id = +cardEl.dataset.id;
      if (e.target.closest('.info')) { e.preventDefault(); openDetail(id, { pickable: true, onPick: () => { pickCat(i, id); } }); return; }
      if (e.target.closest('.pick')) pickCat(i, id);
    });
    app.querySelector('#back').addEventListener('click', () => go(i === 0 ? 'landing' : 'cat-' + (i - 1)));
    app.querySelector('#next').addEventListener('click', () => go(nextStep('cat-' + i)));
    // warm the next round's thumbnails
    if (i < 13) G.watchesInCat(i + 1).forEach(w => { const im = new Image(); im.src = G.thumb(w.id); });
  }
  function card(w, k) {
    const on = S.picks.cats[G.catOf(w.id)] === w.id;
    return `<div class="card ${on ? 'on' : ''}" data-id="${w.id}">
      <button type="button" class="pick" aria-pressed="${on}" aria-label="Pick ${esc(w.brand + ' ' + w.name)}">
        <div class="pic"><span class="tick">Your pick</span><img src="${G.thumb(w.id)}" alt="" ${k > 1 ? 'loading="lazy"' : ''}></div>
        <div class="brand">${esc(w.brand)}</div><div class="model">${esc(w.name)}</div><div class="price">${esc(w.priceLabel)}</div>
      </button>
      <button type="button" class="info" aria-label="Details for ${esc(w.brand + ' ' + w.name)}">i</button>
    </div>`;
  }
  function pickCat(i, id) {
    S.picks.cats[i] = id; saveDraft();
    app.querySelectorAll('.card').forEach(el => { const on = +el.dataset.id === id; el.classList.toggle('on', on); const b = el.querySelector('.pick'); if (b) b.setAttribute('aria-pressed', on); });
    const n = app.querySelector('#next'); if (n) n.disabled = false;
  }

  /* ---------- special prizes: Aiguille d'Or (required) and the three bonus prizes (optional) ---------- */
  const SPECIAL_UI = {
    aiguille: { eyebrow: 'Grand Prix · best in show', sub: 'The one watch above all', hint: 'Usually one of the category winners. Pick from yours below, or search every nominee.', shortlist: 'winners' },
    audacity: { eyebrow: 'Bonus prize · optional', sub: 'The most daring watch', hint: 'For the nominee that breaks the rules: an odd display, a wild mechanism, a shape nobody expected. Skip if nothing grabs you.', shortlist: 'winners' },
    revelation: { eyebrow: 'Bonus prize · optional', sub: 'Best from a young brand', hint: 'A standout from a brand less than ten years old. Search for the name you have in mind, or skip.', shortlist: 'winners' },
    chronometry: { eyebrow: 'Bonus prize · optional', sub: 'Precision, certified', hint: 'Only officially certified movements qualify. The nominees that list a certification are below.', shortlist: 'certified' },
  };
  function renderSpecial(key) {
    const sp = D.specials.find(x => x.id === key), ui = SPECIAL_UI[key];
    const optional = !!sp.optional;
    const winners = S.picks.cats.map((id, i) => id == null ? null : { id, tag: D.categories[i].name }).filter(Boolean);
    const certified = D.watches.filter(w => w.specs.some(([k]) => k === 'Certification')).map(w => ({ id: w.id, tag: (w.specs.find(([k]) => k === 'Certification') || [])[1] + ' · ' + D.categories[G.catOf(w.id)].name }));
    const short = ui.shortlist === 'certified' ? certified : winners;
    const shortTitle = ui.shortlist === 'certified' ? 'Certified nominees' : 'Your category winners';
    app.innerHTML = `
      ${lockedNotice()}
      <div class="roundhead">
        <div><div class="eyebrow">${esc(ui.eyebrow)}</div><h1 class="title big"><b>${esc(sp.short)}</b><span>${esc(ui.sub)}</span></h1></div>
        <div class="ptsbadge ${optional ? '' : 'red'}">${sp.pts} pt${sp.pts > 1 ? 's' : ''}</div>
        <p class="blurb">${esc(sp.blurb)} ${esc(ui.hint)}</p>
      </div>
      <div class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search all 84 nominees" aria-label="Search all 84 nominees by brand or model" autocomplete="off"></div>
      <div id="list"></div>
      <div class="actions">
        <button class="btn ghost" id="back">← Back</button>
        <span class="hint" id="hint"></span>
        <button class="btn" id="next" ${!optional && S.picks[key] == null ? 'disabled' : ''}>${S.picks[key] == null && optional ? 'Skip →' : 'Next →'}</button>
      </div>`;
    const list = app.querySelector('#list'), q = app.querySelector('#q');
    const cur = () => S.picks[key];
    const draw = () => {
      const term = q.value.trim().toLowerCase();
      let html = '';
      if (term) {
        const hits = D.watches.filter(w => (w.brand + ' ' + w.name + ' ' + D.categories[G.catOf(w.id)].name).toLowerCase().includes(term));
        html = `<div class="sechead">${hits.length} ${hits.length === 1 ? 'match' : 'matches'}</div><div class="rows">${hits.map(w => row(w, D.categories[G.catOf(w.id)].name, cur() === w.id)).join('') || '<div class="empty">No nominee matches that.</div>'}</div>`;
      } else {
        if (cur() != null && !short.some(x => x.id === cur())) html += `<div class="sechead">Your pick</div><div class="rows">${row(D.watches[cur()], D.categories[G.catOf(cur())].name, true)}</div>`;
        html += `<div class="sechead">${shortTitle}<span class="pts">${short.length}</span></div><div class="rows">${short.map(x => row(D.watches[x.id], x.tag, cur() === x.id)).join('') || '<div class="empty">Pick your category winners first, or search above.</div>'}</div>`;
      }
      list.innerHTML = html;
      app.querySelector('#hint').textContent = cur() == null ? (optional ? 'Optional: pick one or skip' : 'Choose one nominee') : 'Your pick: ' + D.watches[cur()].brand;
      const n = app.querySelector('#next'); n.disabled = !optional && cur() == null; n.textContent = cur() == null && optional ? 'Skip →' : 'Next →';
    };
    const setPick = id => { S.picks[key] = (optional && cur() === id) ? null : id; saveDraft(); draw(); };
    q.addEventListener('input', draw);
    list.addEventListener('click', e => {
      const r = e.target.closest('.row'); if (!r) return;
      const id = +r.dataset.id;
      if (e.target.closest('.peek')) { openDetail(id, { pickable: true, pickLabel: 'Pick for ' + sp.short, onPick: () => { S.picks[key] = id; saveDraft(); draw(); } }); return; }
      setPick(id);
    });
    app.querySelector('#back').addEventListener('click', () => go(prevStep(key)));
    app.querySelector('#next').addEventListener('click', () => go(nextStep(key)));
    draw();
  }
  function row(w, tag, on) {
    return `<button type="button" class="row ${on ? 'on' : ''}" data-id="${w.id}"><span class="pic"><img src="${G.thumb(w.id)}" alt="" loading="lazy"></span><span class="t"><b>${esc(w.brand)}</b><span>${esc(w.name)}</span><i>${esc(tag)} · ${esc(w.priceLabel)}</i></span><span class="mark">${on ? 'Your pick' : '<span class="linkbtn peek">Details</span>'}</span></button>`;
  }

  /* ---------- review & submit ---------- */
  function renderReview() {
    const missing = S.picks.cats.filter(x => x == null).length + (S.picks.aiguille == null ? 1 : 0);
    const tiles = [reviewTile('Aiguille d’Or · 3 pts', S.picks.aiguille, 'aiguille', true)]
      .concat(D.categories.map((c, i) => reviewTile(c.name, S.picks.cats[i], 'cat-' + i, true)))
      .concat(D.specials.slice(1).map(sp => reviewTile(sp.short + ' · bonus', S.picks[sp.id], sp.id, false)));
    app.innerHTML = `
      ${lockedNotice()}
      <div class="roundhead">
        <div><div class="eyebrow">Last step</div><h1 class="title big"><b>${missing ? 'Almost there' : 'Submit your ballot'}</b><span>${missing ? 'Fill the blanks below' : 'One tap and you’re in the pool'}</span></h1></div>
      </div>
      ${missing ? `<div class="notice red">${missing} required ${missing === 1 ? 'pick is' : 'picks are'} still blank. Tap a blank tile to fill it in.</div>` : ''}
      <div class="field" id="namewrap">${S.name ? `<div class="small">Playing as <b>${esc(S.name)}</b> · <button type="button" class="linkbtn" id="chgname">change</button></div><input class="input hidden" id="name2" type="text" maxlength="40" value="${esc(S.name)}" autocomplete="name">` : `<label for="name2">Your name</label><input class="input" id="name2" type="text" maxlength="40" value="" placeholder="Your name" autocomplete="name">`}</div>
      <div class="actions" style="position:static;border-top:0;padding-top:0;margin-top:4px"><button class="btn big red" id="lock" ${missing || G.isLocked() ? 'disabled' : ''}>Submit ballot</button></div>
      <p class="tiny muted" style="margin:-4px 0 18px">Your ballot joins the pool straight away. Tap any tile to change it; you can edit until the ceremony starts.</p>
      <div class="minigrid review">${tiles.join('')}</div>
      <div class="actions">
        <button class="btn ghost" id="back">← Back</button>
        <button class="btn red" id="lock2" ${missing || G.isLocked() ? 'disabled' : ''}>Submit ballot</button>
      </div>`;
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
    const nm = app.querySelector('#name2'); nm.addEventListener('input', e => { S.name = e.target.value; saveDraft(); });
    const chg = app.querySelector('#chgname'); if (chg) chg.addEventListener('click', () => { nm.classList.remove('hidden'); chg.parentElement.classList.add('hidden'); nm.focus(); });
    app.querySelector('#back').addEventListener('click', () => go('chronometry'));
    app.querySelector('#lock').addEventListener('click', submit);
    app.querySelector('#lock2').addEventListener('click', submit);
  }
  function reviewTile(label, id, goTo, required) {
    const w = id == null ? null : D.watches[id];
    const cls = w ? '' : required ? 'missing' : 'skipped';
    return `<button type="button" class="mini rtile ${cls}" data-go="${goTo}" aria-label="${esc(label)}: ${w ? esc(w.brand + ' ' + w.name) : required ? 'no pick yet' : 'skipped'}"><div class="pic">${w ? `<img src="${G.thumb(w.id)}" alt="" loading="lazy">` : `<span class="ph">${required ? 'Pick' : 'Skipped'}</span>`}</div><div class="cat">${esc(label)}</div>${w ? `<div class="brand">${esc(w.brand)}</div><div class="model">${esc(w.name)}</div>` : `<div class="brand ${required ? 'red' : 'muted'}">${required ? 'Tap to pick' : 'Tap to add'}</div>`}</button>`;
  }
  function submit() {
    const nmEl = app.querySelector('#name2'); const name = ((nmEl && nmEl.value) || S.name || '').trim();
    if (!name) { if (nmEl) { nmEl.classList.remove('hidden'); nmEl.focus(); } toast('Add your name first'); return; }
    if (G.isLocked()) { toast('Ballots are locked'); return; }
    S.name = name;
    const ballot = { name, picks: S.picks, ts: Date.now() };
    const code = G.encodeBallot(ballot);
    const check = G.decodeBallot(code);
    if (!check) { toast('Something went wrong encoding your ballot'); return; }
    S.submitted = check;
    G.lsSet(G.KEYS.ballot, { name: check.name, ts: check.ts, code });
    G.lsDel(G.KEYS.draft);
    poolState = 'pending';
    go('card');
    syncPool();
  }

  /* ---------- ballot card ---------- */
  function renderCard(b, mode) {
    if (!b) return render('landing');
    const url = G.ballotURL(b.code);
    const aig = b.picks.aiguille == null ? null : D.watches[b.picks.aiguille];
    const minis = D.categories.map((c, i) => mini(c.name, b.picks.cats[i])).join('');
    const bonus = D.specials.slice(1).filter(sp => b.picks[sp.id] != null).map(sp => mini(sp.short, b.picks[sp.id])).join('');
    const own = mode === 'own';
    app.innerHTML = `
      <section class="ballothead" style="margin:0 -20px"><div class="wrap">
        <div class="eyebrow">GPHG 2026 · ballot ${own ? 'locked' : 'received'} ${esc(G.fmtDate(b.ts))}</div>
        <h1>${esc(G.possessive(b.name))}<br>ballot</h1>
        <div class="meta">${aig ? 'Aiguille d’Or: ' + esc(aig.brand + ' ' + aig.name) : 'No Aiguille d’Or pick'}</div>
      </div></section>
      ${own ? `<div class="share">
        <div id="poolstatus">${poolHTML()}</div>
        <h2 class="title" style="margin-top:6px"><b>You’re in</b><span>Compare picks with the group</span></h2>
        <div class="btns">
          <a class="btn red" href="board.html">Everyone’s picks</a>
          <button class="btn" id="share">Share</button>
          <button class="btn ghost" id="copy">Copy link</button>
          <button class="btn ghost" id="dl">Download</button>
        </div>
        <div class="linkbox"><code id="url">${esc(url)}</code></div>
        <p class="small muted" style="margin:12px 0 0">${G.isLocked() ? 'The ceremony has started, so picks are final.' : 'Changed your mind? <button class="linkbtn" data-act="edit">Edit picks</button> until the ceremony starts; the pool keeps your latest ballot.'}</p>
      </div>` : `<div class="share">
        <div class="eyebrow">This is ${esc(G.possessive(b.name))} ballot</div>
        <h2 class="title" style="margin-top:4px"><b>Think you can do better?</b><span>Make your own in about five minutes</span></h2>
        <div class="btns"><a class="btn red" href="./" id="mine">Make my ballot</a><a class="btn ghost" href="board.html">Standings</a></div>
        <p class="small muted" style="margin:12px 0 0">Every locked ballot joins the pool automatically. See them all on the <a href="board.html">standings page</a>.</p>
      </div>`}
      <div class="sechead">Grand Prix · Aiguille d’Or<span class="pts">3 pts</span></div>
      ${aig ? `<div class="gp" role="button" tabindex="0" aria-label="Details for ${esc(aig.brand + ' ' + aig.name)}"><div class="pic"><img src="${G.full(aig.id)}" alt=""></div><div><div class="eyebrow">Best in show</div><h3>${esc(aig.brand)}</h3><div class="model">${esc(aig.name)}</div><div class="small muted" style="margin-top:6px">${esc(D.categories[G.catOf(aig.id)].name)} · ${esc(aig.priceLabel)}</div></div></div>` : '<div class="empty">No pick</div>'}
      <div class="sechead">Category winners<span class="pts">1 pt each</span></div>
      <div class="minigrid">${minis}</div>
      ${bonus ? `<div class="sechead">Bonus prizes<span class="pts">1 pt each</span></div><div class="minigrid">${bonus}</div>` : ''}
      <p class="small muted" style="margin-top:28px">Tap any watch to see its details.</p>`;
    app.querySelectorAll('.mini[data-id]').forEach(m => m.addEventListener('click', () => openDetail(+m.dataset.id, { pickable: false })));
    const gpEl = app.querySelector('.gp'); if (gpEl && aig) gpEl.addEventListener('click', () => openDetail(aig.id, { pickable: false }));
    app.querySelectorAll('[data-act]').forEach(x => x.addEventListener('click', () => act(x.dataset.act)));
    if (own) {
      paintPool();
      const text = `${b.name}’s GPHG 2026 ballot${aig ? ' — ' + aig.brand + ' ' + aig.name + ' for the Aiguille d’Or' : ''}`;
      app.querySelector('#share').addEventListener('click', async () => {
        if (navigator.share) { try { await navigator.share({ title: 'GPHG 2026 ballot', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
        copy(url);
      });
      app.querySelector('#copy').addEventListener('click', () => copy(url));
      app.querySelector('#dl').addEventListener('click', () => download(b, url));
    }
  }
  function mini(label, id) {
    const w = id == null ? null : D.watches[id];
    const inner = `<div class="pic">${w ? `<img src="${G.thumb(w.id)}" alt="" loading="lazy">` : ''}</div><div class="cat">${esc(label)}</div>${w ? `<div class="brand">${esc(w.brand)}</div><div class="model">${esc(w.name)}</div>` : '<div class="model">No pick</div>'}`;
    return w ? `<button type="button" class="mini" data-id="${w.id}" aria-label="${esc(label + ': ' + w.brand + ' ' + w.name)}">${inner}</button>` : `<div class="mini">${inner}</div>`;
  }
  async function copy(url) {
    try { await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Link copied'); } catch (e2) { toast('Copy the link from the box'); } ta.remove(); }
  }
  function download(b, url) {
    const picks = {};
    D.categories.forEach((c, i) => picks[c.name] = b.picks.cats[i] == null ? null : G.watchLabel(b.picks.cats[i]));
    D.specials.forEach(sp => picks[sp.name] = b.picks[sp.id] == null ? null : G.watchLabel(b.picks[sp.id]));
    const blob = new Blob([JSON.stringify({ name: b.name, submitted: new Date(b.ts).toISOString(), code: b.code, url, picks }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gphg-2026-ballot-' + b.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- detail sheet ---------- */
  function openDetail(id, opts) {
    const w = D.watches[id]; if (!w) return;
    const cat = D.categories[G.catOf(id)];
    const imgs = Array.from({ length: w.imgs }, (_, k) => k);
    const specs = w.specs.map(([k, v]) => `<div class="spec"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('');
    const el = document.createElement('div');
    el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', w.brand + ' ' + w.name);
    el.innerHTML = `
      <div class="bar"><div class="wrap in"><div class="eyebrow ink">${esc(cat.name)} · nominee</div><button class="x" aria-label="Close">×</button></div></div>
      <div class="wrap">
        <h1 class="title big" style="margin-top:20px"><b>${esc(w.brand)}</b><span>${esc(w.name)}</span></h1>
        <div class="detail">
          <div class="gallery">
            <div class="main"><img id="mainimg" src="${G.full(id, 0)}" alt="${esc(w.brand + ' ' + w.name)}"></div>
            ${imgs.length > 1 ? `<div class="thumbs">${imgs.map(k => `<button type="button" class="${k === 0 ? 'on' : ''}" data-k="${k}" aria-label="Photo ${k + 1}"><img src="${G.thumb(id, k)}" alt=""></button>`).join('')}</div>` : ''}
            <div class="links"><a href="${esc(w.url)}" target="_blank" rel="noopener">GPHG page ↗</a>${w.video ? `<a href="${esc(w.video)}" target="_blank" rel="noopener">Video ↗</a>` : ''}</div>
          </div>
          <div>
            <div class="pricebig">${esc(w.priceLabel)}</div>
            <div class="small muted">Price incl. VAT · ${esc(cat.name)}</div>
            <div class="specs">${specs}</div>
            <div class="sechead" style="margin-top:14px">Description</div>
            <div class="desc clamp" id="desc">${w.desc || '<p class="muted">No description provided.</p>'}</div>
            <button type="button" class="linkbtn" id="more" style="margin-top:6px">Read more</button>
          </div>
        </div>
      </div>
      <div class="actions"><div class="in"><button type="button" class="btn ghost" data-close>Close</button>${opts.pickable ? `<button type="button" class="btn red" data-pick>${esc(opts.pickLabel || 'Pick this watch')}</button>` : ''}</div></div>`;
    el.querySelectorAll('.thumbs button').forEach(b => b.addEventListener('click', () => { el.querySelector('#mainimg').src = G.full(id, +b.dataset.k); el.querySelectorAll('.thumbs button').forEach(x => x.classList.toggle('on', x === b)); }));
    const desc = el.querySelector('#desc'), more = el.querySelector('#more');
    requestAnimationFrame(() => { if (desc.scrollHeight <= 200) { desc.classList.remove('clamp'); more.remove(); } });
    more.addEventListener('click', () => { const c = desc.classList.toggle('clamp'); more.textContent = c ? 'Read more' : 'Show less'; });
    el.querySelector('.x').addEventListener('click', () => closeSheet());
    el.querySelector('[data-close]').addEventListener('click', () => closeSheet());
    const pk = el.querySelector('[data-pick]'); if (pk) pk.addEventListener('click', () => { closeSheet(); opts.onPick && opts.onPick(); toast('Picked ' + w.brand); });
    showSheet(el);
  }
  const focusStack = [];
  function setInert(on) { ['header', '#app', 'footer'].forEach(sel => { const el = document.querySelector(sel); if (el) { if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert'); } }); }
  function showSheet(el) {
    focusStack.push(document.activeElement);
    document.body.appendChild(el); document.body.classList.add('noscroll'); sheetDepth++;
    setInert(true);
    history.pushState({ sheet: sheetDepth }, '');
    const x = el.querySelector('.x'); if (x) { try { x.focus({ preventScroll: true }); } catch (e) {} }
  }
  function closeSheet(fromPop) {
    const sheets = document.querySelectorAll('.sheet'); if (!sheets.length) return;
    sheets[sheets.length - 1].remove(); sheetDepth = Math.max(0, sheetDepth - 1);
    if (sheetDepth === 0) { document.body.classList.remove('noscroll'); setInert(false); }
    const prev = focusStack.pop(); if (prev && prev.isConnected && sheetDepth === 0) { try { prev.focus({ preventScroll: true }); } catch (e) {} }
    if (!fromPop && history.state && history.state.sheet) { pendingBack = true; history.back(); setTimeout(() => { if (pendingBack) { pendingBack = false; const s = pendingNav; pendingNav = null; if (s) go(s); } }, 400); }
  }

  /* ---------- keys & toast ---------- */
  function onKey(e) {
    if (e.key === 'Escape' && sheetDepth > 0) { closeSheet(); return; }
    // Enter/Space on anything with role=button behaves like a click (tiles rendered as divs).
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.tagName !== 'BUTTON') { e.preventDefault(); e.target.click(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;   // Cmd/Ctrl/Alt+digit are browser tab shortcuts, not picks
    if (sheetDepth > 0 || !S.step || !S.step.startsWith('cat-')) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    const i = +S.step.slice(4);
    if (/^[1-6]$/.test(e.key)) { pickCat(i, i * 6 + (+e.key - 1)); }
    else if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON' && e.target.id !== 'next') return;   // Enter on a focused card just picks it
    else if ((e.key === 'ArrowRight' || e.key === 'Enter') && S.picks.cats[i] != null) { const n = app.querySelector('#next'); n && n.click(); }
    else if (e.key === 'ArrowLeft') { const b = app.querySelector('#back'); b && b.click(); }
  }
  let toastT = null;
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

  boot();
})();
</script>
</body>
</html>
